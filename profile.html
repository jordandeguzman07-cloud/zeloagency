<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Zelo Talent Agency</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
            color: #333;
        }
        /* Top Header Styling */
        .site-header {
            background-color: #000;
            color: #fff;
            text-align: center;
            padding: 25px 20px;
            margin-bottom: 30px;
        }
        .site-header h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 2px;
            color: #ff3333;
            text-transform: uppercase;
            font-family: serif;
        }
        .site-header p {
            margin: 8px 0 0 0;
            font-size: 13px;
            letter-spacing: 1px;
        }
        .profile-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px 40px 20px;
        }
        /* Top Two-Column Images */
        .top-image-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .top-image-grid img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }
        /* Selfie Gallery Grid */
        .selfie-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .selfie-grid img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }
        /* Profile Details Box */
        .profile-specs {
            border-top: 1px solid #ccc;
            border-bottom: 1px solid #ccc;
            padding: 20px 0;
            margin-bottom: 30px;
        }
        .profile-specs h2 {
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 15px;
            font-family: serif;
            font-weight: normal;
            text-transform: uppercase;
        }
        .specs-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px 10px;
            font-size: 12px;
            margin-bottom: 20px;
        }
        .spec-item label {
            display: block;
            color: #777;
            text-transform: uppercase;
            font-size: 10px;
            margin-bottom: 3px;
            letter-spacing: 0.5px;
        }
        .spec-item span {
            font-weight: bold;
            color: #111;
        }
        .verified-badge {
            border: 1px solid #333;
            text-align: center;
            padding: 10px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .whatsapp-cta {
            background-color: #000;
            color: #fff;
            text-align: center;
            padding: 12px;
            text-decoration: none;
            display: block;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
            font-weight: bold;
        }
        details {
            border: 1px solid #e0e0e0;
            margin-bottom: 10px;
            background: #fff;
        }
        summary {
            padding: 14px 20px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            list-style: none;
            position: relative;
        }
        summary::-webkit-details-marker { display: none; }
        summary::after {
            content: "▼";
            position: absolute;
            right: 20px;
            font-size: 11px;
            color: #555;
        }
        details[open] summary::after { content: "▲"; }
        .accordion-content {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            background: #fafafa;
        }
        @media (max-width: 768px) {
            .top-image-grid, .specs-grid, .selfie-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="site-header">
        <h1>Zelo Agency</h1>
        <p><span id="header-name">Loading...</span> ♥</p>
    </div>

    <div class="profile-container">

        <!-- Top Two Photos Grid -->
        <div class="top-image-grid">
            <img id="profile-photo-1" src="" alt="Photo 1">
            <img id="profile-photo-2" src="" alt="Photo 2">
        </div>

        <!-- Profile Specs Section -->
        <div class="profile-specs">
            <h2>Profile</h2>
            <div class="specs-grid">
                <div class="spec-item"><label>Location</label><span id="spec-city">Sydney</span></div>
                <div class="spec-item"><label>Height</label><span id="spec-height">163 cm</span></div>
                <div class="spec-item"><label>Eyes</label><span id="spec-eyes">Green</span></div>
                <div class="spec-item"><label>Email</label><span id="spec-email">admin@zeloagency.com.au</span></div>
                
                <div class="spec-item"><label>Age</label><span id="spec-age">22</span></div>
                <div class="spec-item"><label>Dress Size</label><span id="spec-dress">6</span></div>
                <div class="spec-item"><label>Place of Service</label><span id="spec-service">Incall, Outcall</span></div>
                <div class="verified-badge">Photos Verified.</div>

                <div class="spec-item"><label>Phone</label><span id="spec-phone">0406 133 210</span></div>
                <div class="spec-item"><label>Hair</label><span id="spec-hair">Dark</span></div>
                <div class="spec-item"><label>Body Type</label><span id="spec-body">Sexy</span></div>
            </div>
            
            <a id="whatsapp-link" href="#" class="whatsapp-cta" target="_blank">Book <span id="cta-name">Talent</span> via WhatsApp</a>
        </div>

        <!-- Accordion: My Selfie Gallery -->
        <details>
            <summary>My Selfie Gallery</summary>
            <div class="accordion-content">
                <div class="selfie-grid" id="selfie-container">
                    <!-- Selfies populated dynamically -->
                </div>
            </div>
        </details>

    </div>

    <script>
        // Talent Database Mapping
        const profiles = {
            "susanna": {
                name: "Susanna",
                status: "Display Only",
                city: "Sydney",
                height: "163 cm",
                eyes: "Green",
                age: "22",
                dress: "6",
                service: "Incall, Outcall",
                phone: "0406 133 210",
                hair: "Dark",
                body: "Sexy",
                photo1: "images/susanna/1.jpg",
                photo2: "images/susanna/2.jpg",
                selfies: [
                    "images/susanna/3.jpg",
                    "images/susanna/4.jpg",
                    "images/susanna/5.jpg"
                ],
                whatsapp: "https://wa.me/61406133210"
            }
        };

        // Extract query parameter ?name=
        const urlParams = new URLSearchParams(window.location.search);
        const talentKey = (urlParams.get('name') || '').toLowerCase();

        if (profiles[talentKey]) {
            const p = profiles[talentKey];
            document.getElementById('page-title').innerText = p.name + " | Zelo Agency";
            document.getElementById('header-name').innerText = p.name + " — " + p.status;
            document.getElementById('cta-name').innerText = p.name;
            document.getElementById('profile-photo-1').src = p.photo1;
            document.getElementById('profile-photo-2').src = p.photo2;
            document.getElementById('spec-city').innerText = p.city;
            document.getElementById('spec-height').innerText = p.height;
            document.getElementById('spec-eyes').innerText = p.eyes;
            document.getElementById('spec-age').innerText = p.age;
            document.getElementById('spec-dress').innerText = p.dress;
            document.getElementById('spec-service').innerText = p.service;
            document.getElementById('spec-phone').innerText = p.phone;
            document.getElementById('spec-hair').innerText = p.hair;
            document.getElementById('spec-body').innerText = p.body;
            document.getElementById('whatsapp-link').href = p.whatsapp;

            // Populate Selfie Gallery dynamically
            const selfieContainer = document.getElementById('selfie-container');
            if (p.selfies && p.selfies.length > 0) {
                selfieContainer.innerHTML = p.selfies.map(img => `<img src="${img}" alt="Selfie Gallery">`).join('');
            }
        } else {
            document.getElementById('header-name').innerText = "Profile Not Found";
        }
    </script>
</body>
</html>
