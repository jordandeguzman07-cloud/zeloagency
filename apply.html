<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply / Onboard | Zelo Talent Agency</title>
    <style>
        body { background: #0b0b0b; color: #ffffff; font-family: 'Segoe UI', sans-serif; padding: 40px 20px; text-align: center; }
        .form-card { max-width: 600px; margin: 0 auto; background: #141414; padding: 30px; border-radius: 8px; border: 1px solid #d4af37; text-align: left; }
        h1 { color: #d4af37; font-size: 1.8rem; margin-bottom: 10px; text-align: center; }
        p { color: #aaa; margin-bottom: 25px; text-align: center; font-size: 0.95rem; }
        label { display: block; margin-top: 15px; color: #d4af37; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; background: #222; border: 1px solid #333; color: #fff; border-radius: 4px; box-sizing: border-box; }
        input[type="file"] { background: #1a1a1a; padding: 10px; border: 1px dashed #d4af37; cursor: pointer; }
        .btn-submit { display: block; width: 100%; margin-top: 25px; padding: 14px; background: linear-gradient(135deg, #F3E5AB, #D4AF37, #AA771C); color: #000; font-weight: bold; text-align: center; text-decoration: none; border: none; border-radius: 4px; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="form-card">
        <h1>Model Profile Submission</h1>
        <p>Complete your profile details and upload your portfolio photos below to launch your listing on Zelo Agency.</p>

        <form id="onboardForm" action="https://formsubmit.co/admin@zeloagency.com.au" method="POST" enctype="multipart/form-data">
            <input type="hidden" name="_subject" value="New Model Application - Zelo Agency">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_next" value="https://buy.stripe.com/7sYbJ3eFG6RjcHc1NR8ww00">
            
            <!-- Auto-response configuration to send a copy/confirmation to the client -->
            <input type="hidden" name="_autoresponse" value="Thank you for applying to Zelo Talent Agency! We have received your profile submission and will review your details shortly.">
            
            <!-- Quick Action Links for Inbox -->
            <input type="hidden" name="Action_Approve" value="mailto:admin@zeloagency.com.au?subject=Application%20Approved%20-%20Zelo%20Agency&body=Hi!%20Your%20application%20to%20Zelo%20Agency%20has%20been%20approved.%20Welcome%20to%20the%20roster!">
            <input type="hidden" name="Action_Reject" value="mailto:admin@zeloagency.com.au?subject=Application%20Status%20-%20Zelo%20Agency&body=Thank%20you%20for%20applying.%20Unfortunately,%20we%20are%20not%20moving%20forward%20at%20this%20time.">  

            <label>Stage Name / Alias</label>
            <input type="text" name="Stage Name" required placeholder="e.g. Alex Rivera">

            <label>Primary City</label>
            <select name="City" required>
                <option value="Sydney">Sydney</option>
                <option value="Melbourne">Melbourne</option>
                <option value="Brisbane">Brisbane</option>
                <option value="Perth">Perth</option>
                <option value="Adelaide">Adelaide</option>
            </select>

            <label>Mobile Number / Contact SMS</label>
            <input type="tel" name="Mobile" required placeholder="0400 000 000">

            <label>Email Address</label>
            <input type="email" name="email" required placeholder="yourname@domain.com">

            <label>Upload Portfolio Photos (Select 1-5 Images)</label>
            <input type="file" name="attachment" accept="image/*" multiple required>

            <label>Select Listing Option</label>
            <select name="Plan" id="plan" required>
                <option value="standard">Standard Listing ($49/mo)</option>
                <option value="spotlight">👑 Spotlight Boost ($25/wk)</option>
            </select>

            <label>Bio / Profile Introduction</label>
            <textarea name="Bio" rows="4" placeholder="Tell clients about yourself..."></textarea>

            <button type="submit" class="btn-submit" id="submitBtn">Submit Details & Proceed to Payment</button>
        </form>
    </div>

</body>
</html>
