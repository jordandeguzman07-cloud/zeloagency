<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Susanna — Zelo Agency</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            color: #111111;
            font-family: Arial, sans-serif;
        }

        /* Top Header Banner */
        .header-banner {
            background-color: #000000;
            text-align: center;
            padding: 30px 20px 20px 20px;
        }

        .brand-logo {
            color: #d1121d; /* Deep Crimson/Red */
            font-family: 'Times New Roman', Times, serif;
            font-size: 2.8rem;
            letter-spacing: 4px;
            font-weight: normal;
            margin-bottom: 8px;
        }

        .model-header-name {
            color: #ffffff;
            font-family: 'Georgia', serif;
            font-size: 1.8rem;
            font-weight: 300;
        }

        .model-header-name span {
            color: #d1121d;
            margin-left: 6px;
        }

        /* Main Content Container */
        .content-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Breadcrumbs */
        .breadcrumbs {
            font-size: 0.75rem;
            color: #888888;
            margin-bottom: 20px;
        }

        .breadcrumbs a {
            color: #d1121d;
            text-decoration: none;
        }

        /* Photo Grid (2-Column Side-by-Side) */
        .photo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 40px;
        }

        @media (max-width: 768px) {
            .photo-grid {
                grid-template-columns: 1fr;
            }
        }

        .photo-grid img {
            width: 100%;
            height: auto;
            display: block;
            border: 1px solid #f0f0f0;
        }

        /* Profile Title Section */
        .profile-heading {
            font-family: 'Georgia', serif;
            font-size: 1.8rem;
            color: #222222;
            margin-bottom: 10px;
            font-weight: normal;
        }

        .divider {
            border-bottom: 1px solid #e5e5e5;
            margin-bottom: 25px;
        }

        /* Attributes 4-Column Grid */
        .attributes-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px 20px;
            margin-bottom: 40px;
        }

        @media (max-width: 768px) {
            .attributes-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .attr-item {
            display: flex;
            flex-direction: column;
        }

        .attr-label {
            font-size: 0.7rem;
            color: #888888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .attr-value {
            font-size: 0.95rem;
            font-weight: bold;
            color: #111111;
            text-transform: uppercase;
        }

        /* Verified Badge Box */
        .verified-badge {
            border: 1px solid #222222;
            padding: 10px;
            text-align: center;
            font-family: 'Georgia', serif;
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            color: #111111;
            margin-top: 5px;
            line-height: 1.2;
        }

        /* Direct Contact / Booking Section */
        .booking-bar {
            background-color: #f9f9f9;
            border: 1px solid #eeeeee;
            padding: 20px;
            text-align: center;
            margin-top: 30px;
        }

        .btn-book {
            display: inline-block;
            background-color: #000000;
            color: #ffffff;
            padding: 12px 30px;
            text-decoration: none;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .btn-book:hover {
            background-color: #d1121d;
        }
    </style>
</head>
<body>

    <!-- Header Banner -->
    <div class="header-banner">
        <div class="brand-logo">ZELO AGENCY</div>
        <div class="model-header-name">Susanna <span>&hearts;</span></div>
    </div>

    <!-- Page Content -->
    <div class="content-container">
        
        <!-- Breadcrumbs -->
        <div class="breadcrumbs">
            <a href="/">Home</a> / <a href="#">Models in Sydney</a> / Susanna
        </div>

        <!-- 2-Column Photo Stream -->
        <div class="photo-grid">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=80" alt="Susanna 1">
            <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=800&q=80" alt="Susanna 2">
        </div>

        <!-- Profile Heading -->
        <h2 class="profile-heading">Profile</h2>
        <div class="divider"></div>

        <!-- 4-Column Attributes Grid -->
        <div class="attributes-grid">
            
            <!-- Column 1 -->
            <div class="attr-item">
                <span class="attr-label">Location</span>
                <span class="attr-value">Sydney</span>
            </div>

            <!-- Column 2 -->
            <div class="attr-item">
                <span class="attr-label">Height</span>
                <span class="attr-value">175 cm</span>
            </div>

            <!-- Column 3 -->
            <div class="attr-item">
                <span class="attr-label">Eyes</span>
                <span class="attr-value">Hazel</span>
            </div>

            <!-- Column 4 -->
            <div class="attr-item">
                <span class="attr-label">E-Mail</span>
                <span class="attr-value">N/A</span>
            </div>

            <!-- Column 1 - Row 2 -->
            <div class="attr-item">
                <span class="attr-label">Age</span>
                <span class="attr-value">24</span>
            </div>

            <!-- Column 2 - Row 2 -->
            <div class="attr-item">
                <span class="attr-label">Dress Size</span>
                <span class="attr-value">8</span>
            </div>

            <!-- Column 3 - Row 2 -->
            <div class="attr-item">
                <span class="attr-label">Place of Service</span>
                <span class="attr-value">Incall, Outcall</span>
            </div>

            <!-- Column 4 - Row 2 (Verified Box) -->
            <div class="attr-item">
                <div class="verified-badge">
                    PHOTOS<br>VERIFIED.
                </div>
            </div>

            <!-- Column 1 - Row 3 -->
            <div class="attr-item">
                <span class="attr-label">Phone</span>
                <span class="attr-value">0406 133 210</span>
            </div>

            <!-- Column 2 - Row 3 -->
            <div class="attr-item">
                <span class="attr-label">Hair</span>
                <span class="attr-value">Brunette</span>
            </div>

            <!-- Column 3 - Row 3 -->
            <div class="attr-item">
                <span class="attr-label">Body Type</span>
                <span class="attr-value">Athletic</span>
            </div>

        </div>

        <!-- Direct Booking Call to Action -->
        <div class="booking-bar">
            <a href="https://wa.me/61406133210?text=Hi%20Zelo%20Agency,%20I'd%20like%20to%20book%20Susanna." class="btn-book" target="_blank">Book Susanna via WhatsApp</a>
        </div>

    </div>

</body>
</html>
