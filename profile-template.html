<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Susanna - Zelo Talent Agency</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
            color: #333;
        }
        /* Top Header Styling */
        .site-header {
            background-color: #000;
            color: #fff;
            text-align: center;
            padding: 25px 20px;
            margin-bottom: 30px;
        }
        .site-header h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 2px;
            color: #ff3333;
            text-transform: uppercase;
            font-family: serif;
        }
        .site-header p {
            margin: 8px 0 0 0;
            font-size: 13px;
            letter-spacing: 1px;
        }
        .profile-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px 40px 20px;
        }
        /* Top Two-Column Images */
        .top-image-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .top-image-grid img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }
        /* Profile Details Box */
        .profile-specs {
            border-top: 1px solid #ccc;
            border-bottom: 1px solid #ccc;
            padding: 20px 0;
            margin-bottom: 30px;
        }
        .profile-specs h2 {
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 15px;
            font-family: serif;
            font-weight: normal;
            text-transform: uppercase;
        }
        .specs-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px 10px;
            font-size: 12px;
            margin-bottom: 20px;
        }
        .spec-item label {
            display: block;
            color: #777;
            text-transform: uppercase;
            font-size: 10px;
            margin-bottom: 3px;
            letter-spacing: 0.5px;
        }
        .spec-item span {
            font-weight: bold;
            color: #111;
        }
        .verified-badge {
            border: 1px solid #333;
            text-align: center;
            padding: 10px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .whatsapp-cta {
            background-color: #000;
            color: #fff;
            text-align: center;
            padding: 12px;
            text-decoration: none;
            display: block;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
            font-weight: bold;
        }
        /* Bottom Sections Styling */
        .vote-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
            padding: 12px 0;
            margin-bottom: 25px;
            font-size: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .vote-btn {
            border: 1px solid #333;
            padding: 8px 16px;
            text-decoration: none;
            color: #333;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        details {
            border: 1px solid #e0e0e0;
            margin-bottom: 10px;
            background: #fff;
        }
        summary {
            padding: 14px 20px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            list-style: none;
            position: relative;
        }
        summary::-webkit-details-marker { display: none; }
        summary::after {
            content: "▼";
            position: absolute;
            right: 20px;
            font-size: 11px;
            color: #555;
        }
        details[open] summary::after { content: "▲"; }
        .accordion-content {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            background: #fafafa;
        }
        .section-title {
            font-size: 20px;
            font-weight: normal;
            border-bottom: 1px solid #ccc;
            padding-bottom: 8px;
            margin-top: 45px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: serif;
        }
        .about-text { font-size: 14px; line-height: 1.6; color: #444; }
        .about-subtitle { font-style: italic; font-size: 13px; margin-bottom: 15px; color: #555; }
        .see-more { color: #b22222; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; text-decoration: none; display: inline-block; margin-top: 10px; font-weight: bold; }
        .rates-container { display: flex; gap: 40px; margin-bottom: 20px; }
        .rate-column { flex: 1; }
        .rate-column h3 { font-size: 15px; text-transform: uppercase; margin-bottom: 15px; letter-spacing: 0.5px; }
        .rate-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 15px; }
        .rate-table td { padding: 8px 0; border-bottom: 1px solid #eee; }
        .rate-table td:last-child { text-align: right; }
        .services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 20px; font-size: 13px; color: #444; list-style-type: disc; padding-left: 20px; margin-bottom: 20px; }
        .availability-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 20px; }
        .availability-table th { text-align: left; padding: 8px 0; border-bottom: 1px solid #ccc; font-weight: 600; }
        .availability-table td { padding: 8px 0; border-bottom: 1px solid #eee; }
        .availability-table td:last-child { text-align: right; }
        .subscribe-box { border: 1px solid #333; padding: 20px; margin-top: 25px; margin-bottom: 20px; }
        .subscribe-box h4 { margin: 0 0 8px 0; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        .subscribe-box p { margin: 0 0 15px 0; font-size: 12px; color: #666; }
        .subscribe-btn { background: #b22222; color: #fff; border: none; padding: 10px 18px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; font-weight: bold; }
        .tours-note { font-size: 13px; color: #444; margin-bottom: 40px; }
        @media (max-width: 768px) {
            .top-image-grid, .specs-grid, .rates-container, .services-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
